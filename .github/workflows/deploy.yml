name: CI & Deploy Cloud Run Job + Interactive Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gmail-inbox-triage-515705
  GCP_REGION: us-west1
  ARTIFACT_REPO: gmail-triage
  CLOUD_RUN_JOB: gmail-inbox-triage
  CLOUD_RUN_SERVICE: gmail-inbox-triage-bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -v

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_GCP_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Build & Push Image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/${CLOUD_RUN_JOB}:${GITHUB_SHA}"
          docker build -t "${IMAGE}" -t "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/${CLOUD_RUN_JOB}:latest" .
          docker push "${IMAGE}"
          docker push "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/${CLOUD_RUN_JOB}:latest"
      - name: Update Cloud Run Job & Interactive Service
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/${CLOUD_RUN_JOB}:${GITHUB_SHA}"
          gcloud run jobs update "${CLOUD_RUN_JOB}" --region "${GCP_REGION}" --image "${IMAGE}"
          gcloud run services update "${CLOUD_RUN_SERVICE}" --region "${GCP_REGION}" --image "${IMAGE}"
