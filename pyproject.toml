[project]
name = "gmail-inbox-triage"
version = "0.3.0"
description = "Serverless GCP 5:30 AM PT Gmail inbox triage & interactive Slack bot using google-genai (Flash-Lite -> Gemini 4 Carbon -> Gemini 4 Neon), Cloud Run Jobs & Services, Cloud Tasks, Firestore, and Google Workspace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.115.0",
    "google-api-python-client>=2.150.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-run>=0.10.0",
    "google-cloud-tasks>=2.16.0",
    "google-genai>=1.10.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.18",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]

[project.scripts]
triage = "inbox_triage.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
